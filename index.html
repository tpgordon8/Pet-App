<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4169E1">
    <link rel="manifest" href="/manifest.json">
    <title>PetLog</title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --text-primary: #1a1a1a;
            --text-secondary: #6c757d;
            --text-tertiary: #adb5bd;
            --border-color: #e9ecef;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-purple: #8b5cf6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --bg-glass: rgba(45, 45, 45, 0.8);
                --text-primary: #f8f9fa;
                --text-secondary: #adb5bd;
                --text-tertiary: #6c757d;
                --border-color: #404040;
                --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
                --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
                --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            }
        }

        body.dark-mode {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-glass: rgba(45, 45, 45, 0.8);
            --text-primary: #f8f9fa;
            --text-secondary: #adb5bd;
            --text-tertiary: #6c757d;
            --border-color: #404040;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* Stats Widget - Glassmorphism */
        .stats-widget {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .stats-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 12px;
        }

        .stat-item {
            text-align: center;
            padding: 14px 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .stat-emoji {
            font-size: 28px;
            margin-bottom: 8px;
            filter: grayscale(0.2);
        }

        .stat-count {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .button:active {
            transform: translateY(0) scale(0.98);
        }

        .button-emoji {
            font-size: 22px;
            margin-right: 10px;
        }

        /* Clean solid colors instead of gradients */
        .poop-button { background: #8B7355; }
        .pee-button { background: #F59E0B; color: #1a1a1a; }
        .food-button { background: #EF4444; }
        .sleep-button { background: #3B82F6; }
        .meds-button { background: #10B981; }

        .feed-container {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            min-height: 200px;
        }

        .feed-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .date-group {
            margin-bottom: 24px;
        }

        .date-header {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-text {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 15px;
            padding: 60px 20px;
            line-height: 1.6;
        }

        .activity-item {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .activity-item:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .activity-emoji {
            font-size: 28px;
            margin-right: 16px;
            filter: grayscale(0.1);
        }

        .activity-details {
            flex: 1;
        }

        .activity-text {
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .activity-user {
            font-weight: 600;
            color: var(--accent-blue);
        }

        .activity-time {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .loading {
            text-align: center;
            color: var(--text-tertiary);
            padding: 40px 20px;
        }

        /* Toast Notification - Glassmorphism */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 24px;
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            font-size: 14px;
            font-weight: 500;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Offline Indicator - Glassmorphism */
        .offline-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .offline-indicator.show {
            display: block;
        }

        /* Loading Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        /* Pet Selector */
        .pet-selector {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-md);
        }

        .pet-selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .pet-selector-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .add-pet-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .add-pet-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .add-pet-btn:active {
            transform: scale(0.95);
        }

        .pet-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pet-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .pet-chip:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .pet-chip.active {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .pet-chip-emoji {
            font-size: 18px;
        }

        .pet-chip-name {
            font-weight: 600;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .emoji-picker {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .emoji-option {
            font-size: 28px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background: var(--bg-primary);
            border: 2px solid transparent;
        }

        .emoji-option:hover {
            transform: scale(1.1);
        }

        .emoji-option.selected {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.1);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .modal-btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .modal-btn-secondary {
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .modal-btn-secondary:hover {
            background: var(--bg-glass);
        }

        .modal-btn:active {
            transform: scale(0.97);
        }

        /* Activity Actions */
        .activity-item {
            position: relative;
        }

        .activity-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .activity-item:hover .activity-actions {
            opacity: 1;
        }

        .action-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
        }

        .action-btn:hover {
            background: var(--bg-primary);
            transform: translateY(-1px);
        }

        .action-btn.delete {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }

        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Edit Modal specifics */
        .datetime-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .datetime-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .select-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 15px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .select-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Undo Toast */
        .undo-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            margin-left: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .undo-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <span id="theme-icon">🌙</span>
    </button>

    <div class="offline-indicator" id="offline">📵 Offline</div>

    <div class="container">
        <div class="header">
            <div class="title">PetLog</div>
            <div class="subtitle">Track your pet's activities</div>
        </div>

        <!-- Daily Stats Widget -->
        <div class="stats-widget">
            <div class="stats-title">📊 Today's Activity</div>
            <div class="stats-grid" id="stats-grid">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Pet Selector -->
        <div class="pet-selector">
            <div class="pet-selector-header">
                <div class="pet-selector-title">Select Pet</div>
                <button class="add-pet-btn" onclick="openAddPetModal()">+ Add Pet</button>
            </div>
            <div class="pet-chips" id="pet-chips">
                <div class="spinner" style="width: 24px; height: 24px; border-width: 2px;"></div>
            </div>
        </div>

        <div class="button-container">
            <button class="button poop-button" onclick="logActivity('Poop', '💩')">
                <span class="button-emoji">💩</span> Poop
            </button>
            <button class="button pee-button" onclick="logActivity('Pee', '💧')">
                <span class="button-emoji">💧</span> Pee
            </button>
            <button class="button food-button" onclick="logActivity('Food', '🍖')">
                <span class="button-emoji">🍖</span> Food
            </button>
            <button class="button sleep-button" onclick="logActivity('Sleep', '😴')">
                <span class="button-emoji">😴</span> Sleep
            </button>
            <button class="button meds-button" onclick="logActivity('Meds', '💊')">
                <span class="button-emoji">💊</span> Meds
            </button>
        </div>

        <div class="feed-container">
            <div class="feed-title">📝 Activity Log</div>
            <div id="activities">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Edit Activity Modal -->
    <div class="modal" id="edit-modal">
        <div class="modal-content">
            <div class="modal-header">Edit Activity</div>

            <div class="form-group">
                <label class="form-label">Activity Type</label>
                <select class="select-input" id="edit-type">
                    <option value="Poop">💩 Poop</option>
                    <option value="Pee">💧 Pee</option>
                    <option value="Food">🍖 Food</option>
                    <option value="Sleep">😴 Sleep</option>
                    <option value="Meds">💊 Meds</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Date & Time</label>
                <input type="datetime-local" class="datetime-input" id="edit-datetime">
            </div>

            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="saveEditActivity()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Add Pet Modal -->
    <div class="modal" id="pet-modal">
        <div class="modal-content">
            <div class="modal-header">Add a Pet</div>

            <div class="form-group">
                <label class="form-label">Pet Name</label>
                <input type="text" class="form-input" id="pet-name" placeholder="Enter pet name" maxlength="20">
            </div>

            <div class="form-group">
                <label class="form-label">Species</label>
                <input type="text" class="form-input" id="pet-species" placeholder="Dog, Cat, etc." maxlength="15">
            </div>

            <div class="form-group">
                <label class="form-label">Choose an Icon</label>
                <div class="emoji-picker" id="emoji-picker">
                    <div class="emoji-option" onclick="selectEmoji('🐕')">🐕</div>
                    <div class="emoji-option" onclick="selectEmoji('🐈')">🐈</div>
                    <div class="emoji-option" onclick="selectEmoji('🐩')">🐩</div>
                    <div class="emoji-option" onclick="selectEmoji('🐈‍⬛')">🐈‍⬛</div>
                    <div class="emoji-option" onclick="selectEmoji('🐾')">🐾</div>
                    <div class="emoji-option" onclick="selectEmoji('🦴')">🦴</div>
                    <div class="emoji-option" onclick="selectEmoji('🐶')">🐶</div>
                    <div class="emoji-option" onclick="selectEmoji('🐱')">🐱</div>
                    <div class="emoji-option" onclick="selectEmoji('🦮')">🦮</div>
                    <div class="emoji-option" onclick="selectEmoji('🐕‍🦺')">🐕‍🦺</div>
                    <div class="emoji-option" onclick="selectEmoji('🐅')">🐅</div>
                    <div class="emoji-option" onclick="selectEmoji('🦁')">🦁</div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="modal-btn modal-btn-primary" onclick="savePet()">Save Pet</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue, set, remove, update } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Theme toggle functionality
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-icon').textContent = '☀️';
            }
        }

        window.toggleTheme = function() {
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');

            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        };

        // Initialize theme on load
        initTheme();

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBZeE0mf4ptN0wunDbEFbgMZ29nfWIA4NQ",
            authDomain: "petlog-c4c1e.firebaseapp.com",
            databaseURL: "https://petlog-c4c1e-default-rtdb.firebaseio.com",
            projectId: "petlog-c4c1e",
            storageBucket: "petlog-c4c1e.firebasestorage.app",
            messagingSenderId: "417384966953",
            appId: "1:417384966953:web:8b00d0cac96e2b7ec2a538"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Pet management state
        let pets = [];
        let currentPetId = localStorage.getItem('currentPetId') || 'all';
        let selectedEmoji = '🐕';

        // Pet Management Functions
        window.openAddPetModal = function() {
            document.getElementById('pet-modal').classList.add('show');
            document.getElementById('pet-name').value = '';
            document.getElementById('pet-species').value = '';
            selectedEmoji = '🐕';
            updateEmojiSelection();
        };

        window.closeModal = function() {
            document.getElementById('pet-modal').classList.remove('show');
        };

        window.selectEmoji = function(emoji) {
            selectedEmoji = emoji;
            updateEmojiSelection();
        };

        function updateEmojiSelection() {
            document.querySelectorAll('.emoji-option').forEach(el => {
                if (el.textContent.trim() === selectedEmoji) {
                    el.classList.add('selected');
                } else {
                    el.classList.remove('selected');
                }
            });
        }

        window.savePet = function() {
            const name = document.getElementById('pet-name').value.trim();
            const species = document.getElementById('pet-species').value.trim();

            if (!name) {
                showToast('❌ Please enter a pet name', 'error');
                return;
            }

            const petId = 'pet_' + Date.now();
            const petsRef = ref(database, `pets/${petId}`);

            set(petsRef, {
                name: name,
                species: species || 'Pet',
                emoji: selectedEmoji,
                createdAt: Date.now()
            }).then(() => {
                showToast(`✅ ${name} added!`, 'success');
                closeModal();
                currentPetId = petId;
                localStorage.setItem('currentPetId', petId);
            }).catch(error => {
                showToast(`❌ ${error.message}`, 'error');
            });
        };

        window.selectPet = function(petId) {
            currentPetId = petId;
            localStorage.setItem('currentPetId', petId);
            renderPetChips();
            // Refresh stats and activities for selected pet
            const activitiesRef = ref(database, 'activities');
            onValue(activitiesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const activitiesArray = Object.entries(data)
                        .map(([id, activity]) => ({ id, ...activity }))
                        .sort((a, b) => b.timestamp - a.timestamp);
                    renderActivities(filterActivitiesByPet(activitiesArray));
                    renderStats(calculateTodayStats(filterActivitiesByPet(activitiesArray)));
                }
            }, { onlyOnce: true });
        };

        function renderPetChips() {
            const container = document.getElementById('pet-chips');

            if (pets.length === 0) {
                container.innerHTML = '<div style="color: var(--text-tertiary); font-size: 13px;">No pets yet. Add your first pet!</div>';
                return;
            }

            const allChip = `
                <div class="pet-chip ${currentPetId === 'all' ? 'active' : ''}" onclick="selectPet('all')">
                    <span class="pet-chip-emoji">🐾</span>
                    <span class="pet-chip-name">All Pets</span>
                </div>
            `;

            const petChips = pets.map(pet => `
                <div class="pet-chip ${currentPetId === pet.id ? 'active' : ''}" onclick="selectPet('${pet.id}')">
                    <span class="pet-chip-emoji">${pet.emoji}</span>
                    <span class="pet-chip-name">${pet.name}</span>
                </div>
            `).join('');

            container.innerHTML = allChip + petChips;
        }

        function filterActivitiesByPet(activities) {
            if (currentPetId === 'all') {
                return activities;
            }
            return activities.filter(activity => activity.petId === currentPetId);
        }

        // Load pets from Firebase
        const petsRef = ref(database, 'pets');
        onValue(petsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                pets = Object.entries(data).map(([id, pet]) => ({ id, ...pet }));
            } else {
                pets = [];
            }
            renderPetChips();
        });

        // Activity Edit/Delete Management
        let currentActivities = [];
        let currentEditActivityId = null;
        let deletedActivity = null;
        let undoTimeout = null;

        const activityEmojiMap = {
            'Poop': '💩',
            'Pee': '💧',
            'Food': '🍖',
            'Sleep': '😴',
            'Meds': '💊'
        };

        window.editActivity = function(activityId) {
            const activity = currentActivities.find(a => a.id === activityId);
            if (!activity) return;

            currentEditActivityId = activityId;

            // Set form values
            document.getElementById('edit-type').value = activity.type;

            // Convert timestamp to datetime-local format
            const date = new Date(activity.timestamp);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const datetimeLocal = `${year}-${month}-${day}T${hours}:${minutes}`;

            document.getElementById('edit-datetime').value = datetimeLocal;

            // Show modal
            document.getElementById('edit-modal').classList.add('show');
        };

        window.closeEditModal = function() {
            document.getElementById('edit-modal').classList.remove('show');
            currentEditActivityId = null;
        };

        window.saveEditActivity = function() {
            if (!currentEditActivityId) return;

            const type = document.getElementById('edit-type').value;
            const datetime = document.getElementById('edit-datetime').value;

            if (!datetime) {
                showToast('❌ Please select a date and time', 'error');
                return;
            }

            const timestamp = new Date(datetime).getTime();
            const emoji = activityEmojiMap[type];

            const activityRef = ref(database, `activities/${currentEditActivityId}`);
            update(activityRef, {
                type: type,
                emoji: emoji,
                timestamp: timestamp
            }).then(() => {
                showToast('✅ Activity updated!', 'success');
                closeEditModal();
            }).catch(error => {
                showToast(`❌ ${error.message}`, 'error');
            });
        };

        window.deleteActivity = function(activityId) {
            const activity = currentActivities.find(a => a.id === activityId);
            if (!activity) return;

            // Confirm deletion
            if (!confirm(`Delete this ${activity.type} activity?`)) {
                return;
            }

            // Store for undo
            deletedActivity = { id: activityId, ...activity };

            // Delete from Firebase
            const activityRef = ref(database, `activities/${activityId}`);
            remove(activityRef).then(() => {
                showDeleteToast();
                startUndoTimeout();
            }).catch(error => {
                showToast(`❌ ${error.message}`, 'error');
            });
        };

        window.undoDelete = function() {
            if (!deletedActivity) return;

            clearTimeout(undoTimeout);

            const activityRef = ref(database, `activities/${deletedActivity.id}`);
            const { id, ...activityData } = deletedActivity;

            set(activityRef, activityData).then(() => {
                showToast('✅ Activity restored!', 'success');
                deletedActivity = null;
            }).catch(error => {
                showToast(`❌ ${error.message}`, 'error');
            });
        };

        function showDeleteToast() {
            const toast = document.getElementById('toast');
            toast.innerHTML = `
                Activity deleted
                <button class="undo-btn" onclick="undoDelete()">Undo</button>
            `;
            toast.className = 'toast show success';

            // Keep toast visible for 30 seconds for undo
            setTimeout(() => {
                if (toast.classList.contains('show')) {
                    toast.classList.remove('show');
                }
            }, 30000);
        }

        function startUndoTimeout() {
            undoTimeout = setTimeout(() => {
                deletedActivity = null;
            }, 30000);
        }

        // Offline queue
        let offlineQueue = [];
        let isOnline = navigator.onLine;

        // Update offline indicator
        function updateOnlineStatus() {
            const indicator = document.getElementById('offline');
            isOnline = navigator.onLine;
            indicator.classList.toggle('show', !isOnline);

            // Process queue when coming back online
            if (isOnline && offlineQueue.length > 0) {
                processOfflineQueue();
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Process offline queue
        function processOfflineQueue() {
            const queue = [...offlineQueue];
            offlineQueue = [];
            queue.forEach(item => {
                const activitiesRef = ref(database, 'activities');
                push(activitiesRef, item);
            });
            showToast(`✅ Synced ${queue.length} offline activities`);
        }

        // Function to log activity
        window.logActivity = function(type, emoji) {
            // Check if user needs to select a specific pet
            if (currentPetId === 'all' && pets.length > 1) {
                showToast('❌ Please select a specific pet first', 'error');
                return;
            }

            // If no pets exist, prompt to add one
            if (pets.length === 0) {
                showToast('❌ Please add a pet first!', 'error');
                openAddPetModal();
                return;
            }

            // Use the current pet or the only pet available
            const petId = currentPetId === 'all' ? pets[0].id : currentPetId;

            const activity = {
                type: type,
                emoji: emoji,
                timestamp: Date.now(),
                user: 'You',
                petId: petId
            };

            if (!isOnline) {
                offlineQueue.push(activity);
                showToast(`📵 ${type} saved offline - will sync later`, 'success');
                return;
            }

            const activitiesRef = ref(database, 'activities');
            push(activitiesRef, activity)
                .then(() => {
                    const petName = pets.find(p => p.id === petId)?.name || 'Pet';
                    showToast(`✅ ${type} logged for ${petName}!`, 'success');
                })
                .catch(error => {
                    showToast(`❌ ${error.message}`, 'error');
                });
        };

        // Calculate today's stats
        function calculateTodayStats(activities) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayTimestamp = today.getTime();

            const todayActivities = activities.filter(a => a.timestamp >= todayTimestamp);

            const stats = {
                Poop: 0,
                Pee: 0,
                Food: 0,
                Sleep: 0,
                Meds: 0
            };

            todayActivities.forEach(activity => {
                if (stats[activity.type] !== undefined) {
                    stats[activity.type]++;
                }
            });

            return stats;
        }

        // Render stats widget
        function renderStats(stats) {
            const statsGrid = document.getElementById('stats-grid');
            const emojis = {
                Poop: '💩',
                Pee: '💧',
                Food: '🍖',
                Sleep: '😴',
                Meds: '💊'
            };

            statsGrid.innerHTML = Object.entries(stats).map(([type, count]) => `
                <div class="stat-item">
                    <div class="stat-emoji">${emojis[type]}</div>
                    <div class="stat-count">${count}</div>
                    <div class="stat-label">${type}</div>
                </div>
            `).join('');
        }

        // Format timestamp
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const options = {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            return date.toLocaleString('en-US', options);
        }

        // Get date label
        function getDateLabel(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            date.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            yesterday.setHours(0, 0, 0, 0);

            if (date.getTime() === today.getTime()) return 'Today';
            if (date.getTime() === yesterday.getTime()) return 'Yesterday';

            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Group activities by date
        function groupByDate(activities) {
            const groups = {};
            activities.forEach(activity => {
                const label = getDateLabel(activity.timestamp);
                if (!groups[label]) groups[label] = [];
                groups[label].push(activity);
            });
            return groups;
        }

        // Render activities
        function renderActivities(activities) {
            const container = document.getElementById('activities');

            if (activities.length === 0) {
                const message = currentPetId === 'all'
                    ? 'No activities yet. Tap a button to start logging! 🐾'
                    : 'No activities for this pet yet. Start logging! 🐾';
                container.innerHTML = `<div class="empty-text">${message}</div>`;
                return;
            }

            const grouped = groupByDate(activities);

            container.innerHTML = Object.entries(grouped).map(([date, items]) => `
                <div class="date-group">
                    <div class="date-header">${date}</div>
                    ${items.map(activity => {
                        const pet = pets.find(p => p.id === activity.petId);
                        const petDisplay = pet ? `${pet.emoji} ${pet.name}` : '🐾';
                        return `
                            <div class="activity-item">
                                <div class="activity-emoji">${activity.emoji}</div>
                                <div class="activity-details">
                                    <div class="activity-text">
                                        <span class="activity-user">${activity.user}</span> logged ${activity.type}
                                        ${currentPetId === 'all' ? ` for <span class="activity-user">${petDisplay}</span>` : ''}
                                    </div>
                                    <div class="activity-time">${formatTime(activity.timestamp)}</div>
                                </div>
                                <div class="activity-actions">
                                    <button class="action-btn" onclick="editActivity('${activity.id}')">Edit</button>
                                    <button class="action-btn delete" onclick="deleteActivity('${activity.id}')">Delete</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `).join('');
        }

        // Listen for real-time updates
        const activitiesRef = ref(database, 'activities');
        onValue(activitiesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentActivities = Object.entries(data)
                    .map(([id, activity]) => ({ id, ...activity }))
                    .sort((a, b) => b.timestamp - a.timestamp);

                const filteredActivities = filterActivitiesByPet(currentActivities);
                renderActivities(filteredActivities);
                renderStats(calculateTodayStats(filteredActivities));
            } else {
                currentActivities = [];
                renderActivities([]);
                renderStats({ Poop: 0, Pee: 0, Food: 0, Sleep: 0, Meds: 0 });
            }
        }, (error) => {
            console.error('Firebase error:', error);
            document.getElementById('activities').innerHTML =
                '<div class="empty-text">⚠️ Connection error. Please refresh the page.</div>';
        });

        // Update relative times every minute
        setInterval(() => {
            const activitiesRef = ref(database, 'activities');
            onValue(activitiesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const activitiesArray = Object.entries(data)
                        .map(([id, activity]) => ({ id, ...activity }))
                        .sort((a, b) => b.timestamp - a.timestamp);
                    renderActivities(activitiesArray);
                }
            }, { onlyOnce: true });
        }, 60000);
    </script>
</body>
</html>
