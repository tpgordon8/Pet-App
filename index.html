<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4169E1">
    <link rel="manifest" href="/manifest.json">
    <title>PetLog</title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.8);
            --text-primary: #1a1a1a;
            --text-secondary: #6c757d;
            --text-tertiary: #adb5bd;
            --border-color: #e9ecef;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-purple: #8b5cf6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --bg-glass: rgba(45, 45, 45, 0.8);
                --text-primary: #f8f9fa;
                --text-secondary: #adb5bd;
                --text-tertiary: #6c757d;
                --border-color: #404040;
                --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
                --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
                --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            }
        }

        body.dark-mode {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --bg-glass: rgba(45, 45, 45, 0.8);
            --text-primary: #f8f9fa;
            --text-secondary: #adb5bd;
            --text-tertiary: #6c757d;
            --border-color: #404040;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-top: 80px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            box-shadow: var(--shadow-md);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* Stats Widget - Glassmorphism */
        .stats-widget {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .stats-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 12px;
        }

        .stat-item {
            text-align: center;
            padding: 14px 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .stat-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        .stat-emoji {
            font-size: 28px;
            margin-bottom: 8px;
            filter: grayscale(0.2);
        }

        .stat-count {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .button:active {
            transform: translateY(0) scale(0.98);
        }

        .button-emoji {
            font-size: 22px;
            margin-right: 10px;
        }

        /* Clean solid colors instead of gradients */
        .poop-button { background: #8B7355; }
        .pee-button { background: #F59E0B; color: #1a1a1a; }
        .food-button { background: #EF4444; }
        .sleep-button { background: #3B82F6; }
        .meds-button { background: #10B981; }

        .feed-container {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            min-height: 200px;
        }

        .feed-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .date-group {
            margin-bottom: 24px;
        }

        .date-header {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .empty-text {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 15px;
            padding: 60px 20px;
            line-height: 1.6;
        }

        .activity-item {
            display: flex;
            align-items: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .activity-item:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .activity-emoji {
            font-size: 28px;
            margin-right: 16px;
            filter: grayscale(0.1);
        }

        .activity-details {
            flex: 1;
        }

        .activity-text {
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .activity-user {
            font-weight: 600;
            color: var(--accent-blue);
        }

        .activity-time {
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .loading {
            text-align: center;
            color: var(--text-tertiary);
            padding: 40px 20px;
        }

        /* Toast Notification - Glassmorphism */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px 24px;
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            font-size: 14px;
            font-weight: 500;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: rgba(16, 185, 129, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .toast.error {
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Offline Indicator - Glassmorphism */
        .offline-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .offline-indicator.show {
            display: block;
        }

        /* Loading Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-blue);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
        <span id="theme-icon">🌙</span>
    </button>

    <div class="offline-indicator" id="offline">📵 Offline</div>

    <div class="container">
        <div class="header">
            <div class="title">PetLog</div>
            <div class="subtitle">Track your pet's activities</div>
        </div>

        <!-- Daily Stats Widget -->
        <div class="stats-widget">
            <div class="stats-title">📊 Today's Activity</div>
            <div class="stats-grid" id="stats-grid">
                <div class="spinner"></div>
            </div>
        </div>

        <div class="button-container">
            <button class="button poop-button" onclick="logActivity('Poop', '💩')">
                <span class="button-emoji">💩</span> Poop
            </button>
            <button class="button pee-button" onclick="logActivity('Pee', '💧')">
                <span class="button-emoji">💧</span> Pee
            </button>
            <button class="button food-button" onclick="logActivity('Food', '🍖')">
                <span class="button-emoji">🍖</span> Food
            </button>
            <button class="button sleep-button" onclick="logActivity('Sleep', '😴')">
                <span class="button-emoji">😴</span> Sleep
            </button>
            <button class="button meds-button" onclick="logActivity('Meds', '💊')">
                <span class="button-emoji">💊</span> Meds
            </button>
        </div>

        <div class="feed-container">
            <div class="feed-title">📝 Activity Log</div>
            <div id="activities">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Theme toggle functionality
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-icon').textContent = '☀️';
            }
        }

        window.toggleTheme = function() {
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');

            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        };

        // Initialize theme on load
        initTheme();

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBZeE0mf4ptN0wunDbEFbgMZ29nfWIA4NQ",
            authDomain: "petlog-c4c1e.firebaseapp.com",
            databaseURL: "https://petlog-c4c1e-default-rtdb.firebaseio.com",
            projectId: "petlog-c4c1e",
            storageBucket: "petlog-c4c1e.firebasestorage.app",
            messagingSenderId: "417384966953",
            appId: "1:417384966953:web:8b00d0cac96e2b7ec2a538"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Offline queue
        let offlineQueue = [];
        let isOnline = navigator.onLine;

        // Update offline indicator
        function updateOnlineStatus() {
            const indicator = document.getElementById('offline');
            isOnline = navigator.onLine;
            indicator.classList.toggle('show', !isOnline);

            // Process queue when coming back online
            if (isOnline && offlineQueue.length > 0) {
                processOfflineQueue();
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Process offline queue
        function processOfflineQueue() {
            const queue = [...offlineQueue];
            offlineQueue = [];
            queue.forEach(item => {
                const activitiesRef = ref(database, 'activities');
                push(activitiesRef, item);
            });
            showToast(`✅ Synced ${queue.length} offline activities`);
        }

        // Function to log activity
        window.logActivity = function(type, emoji) {
            const activity = {
                type: type,
                emoji: emoji,
                timestamp: Date.now(),
                user: 'You'
            };

            if (!isOnline) {
                offlineQueue.push(activity);
                showToast(`📵 ${type} saved offline - will sync later`, 'success');
                return;
            }

            const activitiesRef = ref(database, 'activities');
            push(activitiesRef, activity)
                .then(() => {
                    showToast(`✅ ${type} logged!`, 'success');
                })
                .catch(error => {
                    showToast(`❌ ${error.message}`, 'error');
                });
        };

        // Calculate today's stats
        function calculateTodayStats(activities) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayTimestamp = today.getTime();

            const todayActivities = activities.filter(a => a.timestamp >= todayTimestamp);

            const stats = {
                Poop: 0,
                Pee: 0,
                Food: 0,
                Sleep: 0,
                Meds: 0
            };

            todayActivities.forEach(activity => {
                if (stats[activity.type] !== undefined) {
                    stats[activity.type]++;
                }
            });

            return stats;
        }

        // Render stats widget
        function renderStats(stats) {
            const statsGrid = document.getElementById('stats-grid');
            const emojis = {
                Poop: '💩',
                Pee: '💧',
                Food: '🍖',
                Sleep: '😴',
                Meds: '💊'
            };

            statsGrid.innerHTML = Object.entries(stats).map(([type, count]) => `
                <div class="stat-item">
                    <div class="stat-emoji">${emojis[type]}</div>
                    <div class="stat-count">${count}</div>
                    <div class="stat-label">${type}</div>
                </div>
            `).join('');
        }

        // Format timestamp
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const options = {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            return date.toLocaleString('en-US', options);
        }

        // Get date label
        function getDateLabel(timestamp) {
            const date = new Date(timestamp);
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            date.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);
            yesterday.setHours(0, 0, 0, 0);

            if (date.getTime() === today.getTime()) return 'Today';
            if (date.getTime() === yesterday.getTime()) return 'Yesterday';

            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // Group activities by date
        function groupByDate(activities) {
            const groups = {};
            activities.forEach(activity => {
                const label = getDateLabel(activity.timestamp);
                if (!groups[label]) groups[label] = [];
                groups[label].push(activity);
            });
            return groups;
        }

        // Render activities
        function renderActivities(activities) {
            const container = document.getElementById('activities');

            if (activities.length === 0) {
                container.innerHTML = '<div class="empty-text">No activities yet. Tap a button to start logging! 🐾</div>';
                return;
            }

            const grouped = groupByDate(activities);

            container.innerHTML = Object.entries(grouped).map(([date, items]) => `
                <div class="date-group">
                    <div class="date-header">${date}</div>
                    ${items.map(activity => `
                        <div class="activity-item">
                            <div class="activity-emoji">${activity.emoji}</div>
                            <div class="activity-details">
                                <div class="activity-text">
                                    <span class="activity-user">${activity.user}</span> logged ${activity.type}
                                </div>
                                <div class="activity-time">${formatTime(activity.timestamp)}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `).join('');
        }

        // Listen for real-time updates
        const activitiesRef = ref(database, 'activities');
        onValue(activitiesRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const activitiesArray = Object.entries(data)
                    .map(([id, activity]) => ({ id, ...activity }))
                    .sort((a, b) => b.timestamp - a.timestamp);

                renderActivities(activitiesArray);
                renderStats(calculateTodayStats(activitiesArray));
            } else {
                renderActivities([]);
                renderStats({ Poop: 0, Pee: 0, Food: 0, Sleep: 0, Meds: 0 });
            }
        }, (error) => {
            console.error('Firebase error:', error);
            document.getElementById('activities').innerHTML =
                '<div class="empty-text">⚠️ Connection error. Please refresh the page.</div>';
        });

        // Update relative times every minute
        setInterval(() => {
            const activitiesRef = ref(database, 'activities');
            onValue(activitiesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    const activitiesArray = Object.entries(data)
                        .map(([id, activity]) => ({ id, ...activity }))
                        .sort((a, b) => b.timestamp - a.timestamp);
                    renderActivities(activitiesArray);
                }
            }, { onlyOnce: true });
        }, 60000);
    </script>
</body>
</html>
