name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - 'firebase-rules.json'
      - 'firebase.json'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

jobs:
  deploy-rules:
    name: Deploy Database Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy Firebase Rules
        run: firebase deploy --only database --project petlog-c4c1e --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Comment on success
        if: success()
        run: |
          echo "✅ Firebase rules deployed successfully!"
          echo "🔗 Verify at: https://console.firebase.google.com/project/petlog-c4c1e/database/petlog-c4c1e-default-rtdb/rules"
          echo "🌐 Test app at: https://pet-app-five-chi.vercel.app/"
