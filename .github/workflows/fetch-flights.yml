name: Fetch Flight Deals

on:
  push:
    branches:
      - 'claude/flight-deal-tracker-*'
    paths:
      - '.github/workflows/fetch-flights.yml'
      - 'fetch-deals.js'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-deals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/flight-deal-tracker-S9GVJ

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch flight deals
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node fetch-deals.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || git commit -m "Update flight deals [skip ci]"
          git push
