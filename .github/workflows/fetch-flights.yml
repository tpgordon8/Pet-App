name: Fetch Flight Deals

on:
  push:
    branches:
      - 'claude/flight-deal-tracker-*'
    paths:
      - '.github/workflows/fetch-flights.yml'
      - 'fetch_deals.py'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-deals:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/flight-deal-tracker-S9GVJ

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fli
        run: pip install fli

      - name: Fetch flight deals
        run: python fetch_deals.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || git commit -m "Update flight deals [skip ci]"
          git push
